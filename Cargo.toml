# madmom-rs workspace
#
# External dependency versions are major-only on purpose: they are resolved and
# locked on the first `cargo build` on a machine with network access. Do not bump
# them by hand without re-running the parity tests.
[workspace]
resolver = "2"
members = [
    "crates/madmom-core",
    "crates/madmom-audio",
    "crates/madmom-ml",
    "crates/madmom-features",
    "crates/madmom-io",
    "crates/madmom",
    "crates/madmom-testkit",
    "crates/madmom-cli",
]
# A path dependency inside the workspace directory is an implicit member, which would
# make every --workspace build compile the Triton bindings with their own default
# features (the GPU ones: bindgen, cuda-driver-sys) and fail clippy on their build
# script. They arrive only through the triton-live feature of madmom-ml, so keep them
# out of the workspace.
exclude = ["third_party/tritonserver-rs"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "BSD-3-Clause"
repository = "https://github.com/UncleAndy/madmom-rs"
authors = ["Andrey Velikoredchanin <andy@andyhost.world>"]

[workspace.dependencies]
ndarray = "0.17"
num-complex = "0.4"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
clap = { version = "4", features = ["derive"] }
hound = "3"
rustfft = "6"
# Inference bindings (third_party/tritonserver-rs, in-process Triton) are NOT a
# workspace dependency yet: they are wired up in plan task 2.3 together with the
# `triton-live` feature, because their own dependency set (bindgen, tokio,
# cuda-driver-sys) is resolved even when the crate is optional and unused, which
# would make every offline build of this workspace fail. When task 2.3 lands,
# re-add here with `default-features = false` and map the feature to
# `triton-live = ["dep:tritonserver-rs"]` in crates/madmom-ml/Cargo.toml.

[profile.release]
lto = "thin"
